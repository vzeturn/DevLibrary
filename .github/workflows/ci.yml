name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace
      - name: no_std builds of the crates with a `std` feature
        run: |
          cargo test -p dl-time --no-default-features
          cargo test -p dl-uuid --no-default-features
          cargo test -p dl-otp --no-default-features
          cargo test -p dl-jwt --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p dl-time -p dl-uuid -p dl-otp -p dl-jwt --no-default-features --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --workspace --exclude dl-bench --target wasm32-unknown-unknown --profile min-size
      - run: cargo build -p dl-time -p dl-uuid -p dl-otp -p dl-jwt --no-default-features --target wasm32-unknown-unknown

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo test --workspace --target x86_64-unknown-linux-musl
