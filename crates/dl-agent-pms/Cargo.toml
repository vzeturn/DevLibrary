dl-rand.workspace = true
dl-time.workspace = true
dl-decimal.workspace = true
dl-uuid.workspace = true
dl-ed25519.workspace = true
dl-flate.workspace = true
dl-http.workspace = true
dl-ws.workspace = true
dl-tds.workspace = true
dl-winsvc.workspace = true

[lints]
