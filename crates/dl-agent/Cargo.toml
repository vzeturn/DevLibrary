version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
dl-json.workspace = true
dl-hash.workspace = true
dl-encoding.workspace = true
dl-ed25519.workspace = true
dl-rand.workspace = true
dl-http.workspace = true
dl-winsvc.workspace = true
dl-log.workspace = true
dl-tds.workspace = true
dl-tls.workspace = true
dl-zip.workspace = true
dl-agent-schema.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
dl-cli.workspace = true

[target.'cfg(windows)'.dependencies]
dl-winos.workspace = true

[dev-dependencies]
dl-tds = { workspace = true, features = ["fake-server"] }

