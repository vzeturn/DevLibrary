[package]
name = "dl-otp"
description = "HOTP and TOTP one-time passwords (RFC 4226, RFC 6238) and otpauth URIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[features]
default = ["std"]
# Secret and recovery-code generation (OS entropy via dl-rand) and the clock-based
# `Totp::*_now` helpers. Without it the crate is `no_std` + `alloc`.
std = ["dep:dl-rand"]

[dependencies]
dl-hash.workspace = true
dl-encoding.workspace = true
dl-rand = { workspace = true, optional = true }

[dev-dependencies]
dl-bench.workspace = true
dl-qr.workspace = true

[[bench]]
name = "otp"
harness = false

[[example]]
name = "enrol"
required-features = ["std"]

[lints]
workspace = true
