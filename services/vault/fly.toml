# dl-vault: OpenBao, one machine, Raft on a volume, HTTPS only at the Fly edge (ADR 0005).
app = "dl-vault"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  BAO_ADDR = "http://127.0.0.1:8200"
  BACKUP_INTERVAL_SECONDS = "21600"
  R2_BUCKET = "dl-vault-backups"

[mounts]
  source = "vault_data"
  destination = "/openbao/data"

# Only 443 (TLS at the edge); no port 80 handler, so plain HTTP is never offered publicly.
[[services]]
  internal_port = 8200
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # A sealed or uninitialised vault is still a running machine: report 200 so Fly does not
  # restart it in a loop (a restart reseals it anyway).
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
